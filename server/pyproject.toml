[project]
name = "google-perception-demo"
version = "0.1.0"
description = "A listen-only Pipecat bot that hears how a speaker sounds with Google's Decisions API"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[daily,google,runner,silero,webrtc]>=1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "clips", "conftest", "perception", "reporter"]
